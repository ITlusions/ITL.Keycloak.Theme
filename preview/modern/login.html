<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITLusions - Modern Theme - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 100px rgba(0, 0, 0, 0.1);
            }
            50% {
                box-shadow: 0 20px 70px rgba(0, 120, 212, 0.15), 0 0 120px rgba(0, 120, 212, 0.1);
            }
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e8e8e8 0%, #c0c0c0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 600px;
            border-radius: 24px;
            overflow: hidden;
            background: #ffffff;
            position: relative;
            animation: glow 3s ease-in-out infinite;
        }

        .left-section {
            position: absolute;
            left: 50%;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 40px;
            z-index: 1;
            animation: slideInLeft 0.8s ease-out;
        }

        .left-section::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 120, 212, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }

        .content-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1;
        }

        .tagline {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            max-width: 280px;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: 0.3px;
            word-wrap: break-word;
            white-space: normal;
        }

        .accent {
            color: #ff6b35;
            font-weight: 600;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.1;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .right-section {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 70px;
            border-radius: 16px 0 0 16px;
            z-index: 2;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
            animation: slideInRight 0.8s ease-out;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #0078d4 0%, #00a4ef 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .logo span {
            background: linear-gradient(135deg, #0078d4 0%, #00a4ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .signup-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .signup-link:hover {
            color: #0078d4;
            transform: translateX(4px);
        }

        h1 {
            font-size: 48px;
            color: #000;
            margin-bottom: 35px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }

        .form-group label {
            display: block;
            color: #888;
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: all 0.3s ease;
            color: #333;
        }

        .form-group input:focus {
            outline: none;
            background: #ffffff;
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
            transform: scale(1.02);
        }

        .form-group input:hover {
            border-color: #ddd;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #0078d4;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 28px;
            margin-top: 8px;
        }

        .forgot-password {
            color: #ff6b35;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: #ff5a1f;
            text-decoration: underline;
        }

        .signin-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #ff6b35 0%, #f65454 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.25);
        }

        .signin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 107, 53, 0.35);
        }

        .signin-btn:active {
            transform: translateY(-1px);
        }

        .phone-mockup {
            width: 160px;
            height: 320px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            border-radius: 50px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid #333;
            margin: 40px auto 0;
            box-shadow: 0 20px 60px rgba(0, 120, 212, 0.2);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 20px;
        }

        .chart-bars {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }

        .bar {
            width: 8px;
            background: linear-gradient(180deg, #0078d4 0%, #00a4ef 100%);
            border-radius: 4px;
            transition: height 0.3s ease;
        }

        .bar:hover {
            opacity: 0.7;
        }

        .bar-1 { height: 20px; }
        .bar-2 { height: 35px; }
        .bar-3 { height: 28px; }
        .bar-4 { height: 42px; }
        .bar-5 { height: 30px; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 30px;
            border-top: 1px solid #e5e5e5;
            color: #999;
            font-size: 12px;
            margin-top: auto;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #0078d4;
        }

        .language-selector {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s ease;
        }

        .language-selector:hover {
            color: #0078d4;
        }

        @media (max-width: 1024px) {
            .container {
                height: auto;
                animation: none;
            }

            .left-section {
                display: none;
            }

            .right-section {
                position: relative;
                width: 100%;
                left: auto;
                top: auto;
                transform: none;
                border-radius: 16px;
                padding: 40px 30px;
            }

            .signup-link {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: linear-gradient(135deg, #ff6b35 0%, #f65454 100%);
                color: white;
                padding: 10px 16px;
                border-radius: 50px;
                font-size: 13px;
                font-weight: 600;
                box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
            }

            .signup-link:hover {
                color: white;
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(255, 107, 53, 0.3);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="content-card">
                <div class="tagline">
                    Enterprise <span class="accent">cloud infrastructure</span> and management for modern organizations.
                </div>
                <h2 class="hero-title"><span class="accent">Control</span> your infrastructure</h2>
                <div class="phone-mockup">
                    <div class="phone-screen">
                        <div style="color: #fff; font-size: 14px; font-weight: 500;">Resources</div>
                        <div style="color: #fff; font-size: 28px; font-weight: 600;">2,847</div>
                        <div class="chart-bars">
                            <div class="bar bar-1"></div>
                            <div class="bar bar-2"></div>
                            <div class="bar bar-3"></div>
                            <div class="bar bar-4"></div>
                            <div class="bar bar-5"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">IT</div>
                    <span>Lusions</span>
                </div>
                <a href="#" class="signup-link">
                    <i class="fas fa-user-plus"></i>
                    Sign Up
                </a>
            </div>

            <div class="form-section">
                <h1>Sign In</h1>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email or Username</label>
                        <input type="email" id="email" placeholder="Enter your email or username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="signin-btn">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
            </div>

            <div class="footer">
                <span>&copy; 2024-2025 ITLusions Inc.</span>
                <div class="footer-links">
                    <a href="#">Contact Us</a>
                </div>
                <button class="language-selector">
                    <i class="fas fa-globe"></i>
                    English
                </button>
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                togglePassword.innerHTML = type === 'password' 
                    ? '<i class="fas fa-eye"></i>' 
                    : '<i class="fas fa-eye-slash"></i>';
            });
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Demo mode: Form submission captured');
        });
    </script>
</body>
</html>
