<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITLusions - Modern Theme - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e8e8e8 0%, #c0c0c0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 600px;
            border-radius: 24px;
            overflow: hidden;
            background: #ffffff;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 100px rgba(0, 0, 0, 0.1);
        }

        .left-section {
            position: absolute;
            left: 50%;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 40px;
            z-index: 1;
            animation: slideInLeft 0.8s ease-out;
        }

        .left-section::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 120, 212, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }

        .content-card {
            text-align: center;
            z-index: 1;
        }

        .tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 24px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .accent {
            color: #ff6b35;
        }

        .right-section {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 70px;
            border-radius: 16px 0 0 16px;
            z-index: 2;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
            animation: slideInRight 0.8s ease-out;
        }

        .header {
            margin-bottom: 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #0078d4 0%, #00a4ef 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        h1 {
            font-size: 36px;
            color: #000;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        label {
            display: block;
            color: #888;
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            color: #333;
        }

        input:focus {
            outline: none;
            background: #ffffff;
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
            transform: scale(1.02);
        }

        input:hover {
            border-color: #ddd;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #ff6b35 0%, #f65454 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 107, 53, 0.35);
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 24px;
        }

        .footer a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ff5a1f;
        }

        @media (max-width: 1024px) {
            .container {
                height: auto;
            }
            .left-section {
                display: none;
            }
            .right-section {
                position: relative;
                width: 100%;
                left: auto;
                top: auto;
                transform: none;
                border-radius: 16px;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="content-card">
                <div class="tagline">
                    Start your <span class="accent">cloud journey</span> with ITLusions today
                </div>
                <h2 class="hero-title"><span class="accent">Build</span> with confidence</h2>
            </div>
        </div>

        <div class="right-section">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">IT</div>
                    <span>Lusions</span>
                </div>
                <h1>Create Account</h1>
            </div>

            <form onsubmit="event.preventDefault(); alert('Demo: Account created');">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <div class="footer">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
