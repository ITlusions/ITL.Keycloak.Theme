<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITLusions - Modern Theme - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e8e8e8 0%, #c0c0c0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            height: 600px;
            border-radius: 24px;
            overflow: hidden;
            background: #ffffff;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 100px rgba(0, 0, 0, 0.1);
        }

        .left-section {
            position: absolute;
            left: 50%;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 40px;
            z-index: 1;
            animation: slideInLeft 0.8s ease-out;
        }

        .left-section::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 120, 212, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }

        .content-card {
            text-align: center;
            z-index: 1;
        }

        .key-icon {
            font-size: 64px;
            color: #0078d4;
            margin-bottom: 24px;
        }

        .tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 16px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .accent {
            color: #ff6b35;
        }

        .right-section {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 70px;
            border-radius: 16px 0 0 16px;
            z-index: 2;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
            animation: slideInRight 0.8s ease-out;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            color: #000;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .step-indicator::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e5e7eb;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .step-number {
            width: 36px;
            height: 36px;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #999;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .step.active .step-number {
            background: linear-gradient(135deg, #0078d4 0%, #00a4ef 100%);
            color: white;
            transform: scale(1.1);
        }

        .step-label {
            font-size: 11px;
            color: #999;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
            transform: scale(1.02);
        }

        .password-strength {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        .strength-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .strength-progress {
            height: 100%;
            background: linear-gradient(90deg, #dc2626 0%, #f97316 50%, #10b981 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #ff6b35 0%, #f65454 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.25);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 107, 53, 0.35);
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .back-link a {
            color: #0078d4;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #0056a4;
        }

        @media (max-width: 1024px) {
            .container {
                height: auto;
            }
            .left-section {
                display: none;
            }
            .right-section {
                position: relative;
                width: 100%;
                left: auto;
                top: auto;
                bottom: auto;
                border-radius: 16px;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="content-card">
                <div class="key-icon">
                    <i class="fas fa-key"></i>
                </div>
                <div class="tagline">
                    Reset your password and <span class="accent">regain access</span> to your account
                </div>
                <h2 class="hero-title"><span class="accent">Secure</span> your access</h2>
            </div>
        </div>

        <div class="right-section">
            <div class="header">
                <h1>Reset Password</h1>
                <p class="subtitle">Create a new secure password for your account</p>
            </div>

            <div class="step-indicator">
                <div class="step active">
                    <div class="step-number">1</div>
                    <div class="step-label">Password</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-label">Confirm</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-label">Complete</div>
                </div>
            </div>

            <form onsubmit="event.preventDefault(); alert('Demo: Password reset submitted');">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" placeholder="Enter a strong password" required
                        oninput="updateStrength()">
                    <div class="password-strength">
                        Strength: <span id="strength">Weak</span>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-progress" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="submit-btn">Reset Password</button>

                <div class="back-link">
                    Remember your password? <a href="login.html">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function updateStrength() {
            const password = document.getElementById('password').value;
            const bar = document.getElementById('strengthBar');
            const strength = document.getElementById('strength');
            let score = 0;

            if (password.length >= 8) score += 25;
            if (password.length >= 12) score += 25;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score += 25;
            if (/[0-9]/.test(password) && /[!@#$%^&*]/.test(password)) score += 25;

            bar.style.width = score + '%';
            strength.textContent = score < 25 ? 'Weak' : score < 50 ? 'Fair' : score < 75 ? 'Good' : 'Strong';
        }
    </script>
</body>
</html>
