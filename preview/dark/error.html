<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ITlusions - Dark Error Preview</title>
    <style>
        :root {
            --itl-primary: #3b82f6;
            --itl-error: #ef4444;
            
            --itl-dark-bg: #0f172a;
            --itl-dark-surface: #1e293b;
            --itl-dark-surface-light: #334155;
            --itl-dark-border: #475569;
            --itl-dark-text: #f8fafc;
            --itl-dark-text-subtle: #94a3b8;
            
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: var(--itl-font-family);
            background: linear-gradient(135deg, var(--itl-dark-bg) 0%, #1e293b 100%);
            color: var(--itl-dark-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(239, 68, 68, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10px, -15px); }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--itl-dark-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--itl-shadow-lg);
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .lang-switch button {
            padding: 8px 16px;
            background: var(--itl-dark-surface);
            border: 1px solid var(--itl-dark-border);
            border-radius: 0.375rem;
            color: var(--itl-dark-text);
            cursor: pointer;
            font-size: 0.875rem;
            margin-left: 8px;
        }

        main {
            margin-top: 80px;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(239, 68, 68, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        .error-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            color: var(--itl-error);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--itl-dark-text);
            animation: slideDown 0.6s ease-out 0.2s backwards;
        }

        p {
            color: var(--itl-dark-text-subtle);
            line-height: 1.6;
            animation: fadeIn 0.6s ease-out 0.3s backwards;
        }

        .error-message {
            color: var(--itl-error);
            font-weight: 500;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
        }

        .button {
            display: inline-block;
            padding: 0.875rem 1.5rem;
            background: var(--itl-primary);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        .button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .button-secondary {
            background: var(--itl-dark-surface-light);
            color: var(--itl-dark-text);
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }
            border: 1px solid var(--itl-dark-border);
            margin-left: 0.5rem;
        }

        .button-secondary:hover {
            background: var(--itl-dark-border);
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--itl-dark-text-subtle);
            font-size: 0.875rem;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
          .content-wrapper {
            padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
            min-height: auto;
          }

          .card {
            max-width: 100%;
            padding: 1rem;
          }

          h1 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
          }

          p {
            font-size: 0.875rem;
          }

          .button {
            padding: 1rem;
            font-size: 0.8rem;
          }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
          .content-wrapper {
            padding: calc(70px + 1rem) 1rem 1rem 1rem;
          }

          .card {
            max-width: 100%;
            padding: 1.25rem;
          }

          h1 {
            font-size: 1.375rem;
          }

          p {
            font-size: 0.875rem;
          }

          .button {
            padding: 1.125rem;
            font-size: 0.875rem;
          }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
          .content-wrapper {
            padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
          }

          .card {
            max-width: 100%;
            padding: 1.5rem;
          }

          h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
          }

          .button {
            padding: 1.25rem;
            font-size: 0.9375rem;
          }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
          .content-wrapper {
            padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
          }

          .card {
            max-width: 450px;
            padding: 1.75rem;
          }

          h1 {
            font-size: 1.625rem;
          }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
          .card {
            max-width: 500px;
            padding: 2rem;
          }

          h1 {
            font-size: 1.75rem;
          }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
          .card {
            max-width: 500px;
            padding: 2.5rem;
          }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌙 ITlusions</h1>
        <div class="lang-switch">
            <button onclick="switchLanguage('en')">English</button>
            <button onclick="switchLanguage('nl')">Nederlands</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="error-content">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>

                <h1 id="error-title">Authentication Error</h1>

                <p id="error-message">An error occurred during authentication.</p>

                <p class="error-message" id="error-code">Error: Invalid credentials</p>

                <p id="error-description">Please try again or contact support if the problem persists.</p>

                <div>
                    <button class="button" onclick="goBack()" id="btn-retry">Try Again</button>
                    <button class="button button-secondary" onclick="goHome()" id="btn-home">Go Home</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank" style="color: #60a5fa; text-decoration: none;">ITlusions</a></p>
    </footer>

    <script>
        const translations = {
            en: {
                'error-title': 'Authentication Error',
                'error-message': 'An error occurred during authentication.',
                'error-code': 'Error: Invalid credentials',
                'error-description': 'Please try again or contact support if the problem persists.',
                'btn-retry': 'Try Again',
                'btn-home': 'Go Home'
            },
            nl: {
                'error-title': 'Verificatiefout',
                'error-message': 'Er is een fout opgetreden tijdens verificatie.',
                'error-code': 'Fout: Ongeldige inloggegevens',
                'error-description': 'Probeer het opnieuw of neem contact op met ondersteuning als het probleem aanhoudt.',
                'btn-retry': 'Opnieuw proberen',
                'btn-home': 'Naar startpagina'
            }
        };

        function switchLanguage(lang) {
            const t = translations[lang];
            for (const [key, value] of Object.entries(t)) {
                const el = document.getElementById(key);
                if (el) el.textContent = value;
            }
        }

        function goBack() {
            alert('In production, this would retry the authentication flow.');
        }

        function goHome() {
            alert('In production, this would redirect to the home page.');
        }

        switchLanguage('en');
    </script>
</body>
</html>
