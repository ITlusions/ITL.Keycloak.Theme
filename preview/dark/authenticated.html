<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ITlusions - Dark Authenticated Preview</title>
    <style>
        :root {
            --itl-primary: #3b82f6;
            --itl-accent: #10b981;
            --itl-success: #22c55e;
            
            --itl-dark-bg: #0f172a;
            --itl-dark-surface: #1e293b;
            --itl-dark-surface-light: #334155;
            --itl-dark-border: #475569;
            --itl-dark-text: #f8fafc;
            --itl-dark-text-subtle: #94a3b8;
            
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: var(--itl-font-family);
            background: linear-gradient(135deg, var(--itl-dark-bg) 0%, #1e293b 100%);
            color: var(--itl-dark-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: drift 25s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(15px, -25px); }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--itl-dark-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--itl-shadow-lg);
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        main {
            margin-top: 80px;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: var(--itl-shadow-lg), 0 0 50px rgba(34, 197, 94, 0.15);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        .authenticated-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .authenticated-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--itl-accent) 0%, var(--itl-success) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
            animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .authenticated-icon svg {
            width: 40px;
            height: 40px;
            color: white;
            animation: checkmark 0.8s ease-out 0.3s both;
        }

        @keyframes checkmark {
            0% {
                stroke-dasharray: 60;
                stroke-dashoffset: 60;
            }
            100% {
                stroke-dasharray: 60;
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--itl-dark-text);
            animation: slideDown 0.6s ease-out 0.1s both;
        }

        .message {
            color: var(--itl-dark-text);
            font-size: 1rem;
            animation: slideDown 0.6s ease-out 0.2s both;
        }

        .countdown {
            color: var(--itl-primary);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 0.375rem;
            animation: slideDown 0.6s ease-out 0.3s both;
        }

        #countdown {
            font-weight: 700;
            color: var(--itl-success);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--itl-dark-text-subtle);
            font-size: 0.875rem;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
            main {
                padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
                min-height: auto;
            }

            .card {
                max-width: 100%;
                padding: 1rem;
            }

            .authenticated-icon {
                width: 56px;
                height: 56px;
            }

            .success-icon {
                width: 28px;
                height: 28px;
            }

            .authenticated-title {
                font-size: 1.25rem;
                margin-bottom: 0.5rem;
            }

            .authenticated-message {
                font-size: 0.875rem;
            }

            .button {
                width: 100%;
                padding: 0.875rem;
                font-size: 0.8rem;
            }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
            main {
                padding: calc(70px + 1rem) 1rem 1rem 1rem;
            }

            .card {
                max-width: 100%;
                padding: 1.25rem;
            }

            .authenticated-icon {
                width: 60px;
                height: 60px;
            }

            .success-icon {
                width: 32px;
                height: 32px;
            }

            .authenticated-title {
                font-size: 1.375rem;
            }

            .button {
                width: 100%;
                padding: 1rem;
                font-size: 0.875rem;
            }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
            main {
                padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
            }

            .card {
                max-width: 100%;
                padding: 1.5rem;
            }

            .authenticated-icon {
                width: 64px;
                height: 64px;
            }

            .success-icon {
                width: 36px;
                height: 36px;
            }

            .authenticated-title {
                font-size: 1.5rem;
            }

            .authenticated-message {
                font-size: 1rem;
            }

            .button {
                width: 100%;
                padding: 1.125rem;
                font-size: 0.9375rem;
            }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
            main {
                padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
            }

            .card {
                max-width: 450px;
                padding: 1.75rem;
            }

            .authenticated-icon {
                width: 72px;
                height: 72px;
            }

            .success-icon {
                width: 40px;
                height: 40px;
            }

            .authenticated-title {
                font-size: 1.625rem;
            }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .card {
                max-width: 500px;
                padding: 2rem;
            }

            .authenticated-icon {
                width: 80px;
                height: 80px;
            }

            .authenticated-title {
                font-size: 1.75rem;
            }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
            .card {
                max-width: 500px;
                padding: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌙 ITlusions</h1>
        <div class="lang-switch" style="display: flex; gap: 0.5rem;">
            <button onclick="switchLanguage('en')" style="padding: 8px 16px; background: #334155; border: 1px solid #475569; border-radius: 0.375rem; color: #f8fafc; cursor: pointer; font-size: 0.875rem;">English</button>
            <button onclick="switchLanguage('nl')" style="padding: 8px 16px; background: #334155; border: 1px solid #475569; border-radius: 0.375rem; color: #f8fafc; cursor: pointer; font-size: 0.875rem;">Nederlands</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div id="kc-authenticated">
                <div class="authenticated-content">
                    <div class="authenticated-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h1 id="title">Authentication Successful</h1>
                    <p class="message" id="message">You have been successfully authenticated.</p>
                    <p class="countdown">
                        <span id="label">Redirecting in <span id="countdown">5</span> seconds...</span>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank" style="color: #60a5fa; text-decoration: none;">ITlusions</a></p>
    </footer>

    <script>
        const translations = {
            en: {
                'title': 'Authentication Successful',
                'message': 'You have been successfully authenticated.',
                'label': 'Redirecting in '
            },
            nl: {
                'title': 'Verificatie Geslaagd',
                'message': 'U bent succesvol geverifieerd.',
                'label': 'Doorgeleiding over '
            }
        };

        function switchLanguage(lang) {
            const t = translations[lang];
            for (const [key, value] of Object.entries(t)) {
                const el = document.getElementById(key);
                if (el && key !== 'label') {
                    el.textContent = value;
                }
            }
            const labelEl = document.getElementById('label');
            if (labelEl) {
                const remaining = document.getElementById('countdown').textContent;
                labelEl.textContent = translations[lang]['label'] + remaining + (lang === 'nl' ? ' seconden...' : ' seconds...');
            }
        }

        let remaining = 5;
        const countdownElement = document.getElementById('countdown');
        
        if (countdownElement) {
            const countdownInterval = setInterval(function() {
                remaining--;
                countdownElement.textContent = remaining;
                const labelEl = document.getElementById('label');
                if (labelEl) {
                    const lang = document.querySelector('button[style*="rgb(16, 185, 129)"]') ? 'nl' : 'en';
                    const t = translations[lang];
                    labelEl.textContent = t['label'] + remaining + (lang === 'nl' ? ' seconden...' : ' seconds...');
                }
                if (remaining <= 0) clearInterval(countdownInterval);
            }, 1000);
        }

        switchLanguage('en');
    </script>
</body>
</html>
