<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ITlusions - Dark Login Preview</title>
    <style>
        :root {
            --itl-primary: #3b82f6;
            --itl-primary-dark: #2563eb;
            --itl-primary-light: #60a5fa;
            --itl-accent: #10b981;
            --itl-error: #ef4444;
            
            --itl-dark-bg: #0f172a;
            --itl-dark-surface: #1e293b;
            --itl-dark-surface-light: #334155;
            --itl-dark-border: #475569;
            --itl-dark-text: #f8fafc;
            --itl-dark-text-muted: #cbd5e1;
            --itl-dark-text-subtle: #94a3b8;
            
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
            --itl-shadow-glow: 0 0 20px rgb(59 130 246 / 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        body {
            font-family: var(--itl-font-family);
            background: linear-gradient(135deg, var(--itl-dark-bg) 0%, #1e293b 100%);
            color: var(--itl-dark-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.25) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--itl-dark-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--itl-shadow-lg);
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .lang-switch button {
            padding: 8px 16px;
            background: var(--itl-dark-surface);
            border: 1px solid var(--itl-dark-border);
            border-radius: 0.375rem;
            color: var(--itl-dark-text);
            cursor: pointer;
            font-size: 0.875rem;
            margin-left: 8px;
            transition: all 0.2s ease;
        }

        .lang-switch button:hover {
            background: var(--itl-dark-surface-light);
            border-color: var(--itl-primary);
            color: var(--itl-primary);
        }

        main {
            margin-top: 80px;
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(59, 130, 246, 0.1);
            position: relative;
            animation: fadeIn 0.6s ease-out;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        .logo {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--itl-dark-text);
            margin-bottom: 0.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: fadeIn 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.2s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.3s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.4s;
        }

        label {
            font-weight: 500;
            color: var(--itl-dark-text);
            font-size: 0.875rem;
        }

        input {
            padding: 1rem;
            background: var(--itl-dark-surface-light);
            border: 1px solid var(--itl-dark-border);
            border-radius: 0.375rem;
            color: var(--itl-dark-text);
            font-size: 1rem;
            font-family: var(--itl-font-family);
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--itl-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2), var(--itl-shadow-glow);
        }

        input::placeholder {
            color: var(--itl-dark-text-subtle);
        }

        button[type="submit"] {
            padding: 1.5rem;
            background: var(--itl-primary);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.6s ease-out 0.45s backwards;
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        button[type="submit"]:hover::before {
            left: 100%;
        }

        button:hover {
            background: var(--itl-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.5), 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--itl-primary);
        }

        .form-footer {
            text-align: center;
            font-size: 0.875rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        .form-footer a {
            color: var(--itl-primary-light);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: var(--itl-primary);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--itl-dark-text-subtle);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--itl-dark-border);
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--itl-dark-text-subtle);
            font-size: 0.875rem;
        }

        footer a {
            color: var(--itl-primary-light);
            text-decoration: none;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
          .content-wrapper {
            padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
            min-height: auto;
          }

          .card {
            max-width: 100%;
            width: 100%;
            padding: 1rem;
            margin: 0;
          }

          .form-header h1 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
          }

          .form-header p {
            font-size: 0.75rem;
          }

          .form-group {
            margin-bottom: 1rem;
          }

          label {
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
          }

          input, select, textarea {
            font-size: 16px !important;
            padding: 0.75rem;
          }

          button[type="submit"], .button {
            padding: 1rem;
            font-size: 0.8rem;
            border-radius: 0.25rem;
          }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
          .content-wrapper {
            padding: calc(70px + 1rem) 1rem 1rem 1rem;
          }

          .card {
            max-width: 100%;
            padding: 1.25rem;
          }

          .form-header h1 {
            font-size: 1.375rem;
          }

          .form-header p {
            font-size: 0.875rem;
          }

          input, select, textarea {
            font-size: 16px !important;
            padding: 0.875rem;
          }

          button[type="submit"], .button {
            padding: 1.125rem;
            font-size: 0.875rem;
          }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
          .content-wrapper {
            padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
          }

          .card {
            max-width: 100%;
            padding: 1.5rem;
          }

          .form-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
          }

          input, select, textarea {
            font-size: 16px !important;
            padding: 1rem;
          }

          button[type="submit"], .button {
            padding: 1.25rem;
            font-size: 0.9375rem;
          }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
          .content-wrapper {
            padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
          }

          .card {
            max-width: 450px;
            padding: 1.75rem;
          }

          .form-header h1 {
            font-size: 1.625rem;
          }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
          .card {
            max-width: 500px;
            padding: 2rem;
          }

          .form-header h1 {
            font-size: 1.75rem;
          }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
          .card {
            max-width: 500px;
            padding: 2.5rem;
          }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌙 ITlusions</h1>
        <div class="lang-switch">
            <button onclick="switchLanguage('en')">English</button>
            <button onclick="switchLanguage('nl')">Nederlands</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="form-header">
                <div class="logo">🔐</div>
                <h1 id="title">Sign In</h1>
            </div>

            <form onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="username" id="label-username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password" id="label-password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" id="label-remember" style="margin: 0;">Remember me</label>
                </div>

                <button type="submit" id="btn-signin">Sign In</button>

                <div class="form-footer">
                    <a href="#" id="forgot-link">Forgot Password?</a>
                    <div class="divider" id="divider">or</div>
                    <a href="#" id="signup-link">Create an Account</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank">ITlusions</a> • Your trusted partner in digital transformation</p>
    </footer>

    <script>
        const translations = {
            en: {
                'title': 'Sign In',
                'label-username': 'Username or Email',
                'label-password': 'Password',
                'label-remember': 'Remember me',
                'btn-signin': 'Sign In',
                'forgot-link': 'Forgot Password?',
                'divider': 'or',
                'signup-link': 'Create an Account'
            },
            nl: {
                'title': 'Inloggen',
                'label-username': 'Gebruikersnaam of E-mail',
                'label-password': 'Wachtwoord',
                'label-remember': 'Onthoud mij',
                'btn-signin': 'Inloggen',
                'forgot-link': 'Wachtwoord vergeten?',
                'divider': 'of',
                'signup-link': 'Account aanmaken'
            }
        };

        function switchLanguage(lang) {
            const t = translations[lang];
            for (const [key, value] of Object.entries(t)) {
                const el = document.getElementById(key);
                if (el) el.textContent = value;
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            alert('In production, this would authenticate the user.');
        }

        switchLanguage('en');
    </script>
</body>
</html>
