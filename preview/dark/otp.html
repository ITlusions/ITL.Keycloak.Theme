<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ITlusions - Dark OTP Preview</title>
    <style>
        :root {
            --itl-primary: #3b82f6;
            --itl-primary-dark: #2563eb;
            
            --itl-dark-bg: #0f172a;
            --itl-dark-surface: #1e293b;
            --itl-dark-surface-light: #334155;
            --itl-dark-border: #475569;
            --itl-dark-text: #f8fafc;
            --itl-dark-text-subtle: #94a3b8;
            
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: var(--itl-font-family);
            background: linear-gradient(135deg, var(--itl-dark-bg) 0%, #1e293b 100%);
            color: var(--itl-dark-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 90% 60%, rgba(34, 197, 94, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
            animation: drift 24s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, 15px); }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--itl-dark-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--itl-shadow-lg);
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .lang-switch button {
            padding: 8px 16px;
            background: var(--itl-dark-surface);
            border: 1px solid var(--itl-dark-border);
            border-radius: 0.375rem;
            color: var(--itl-dark-text);
            cursor: pointer;
            font-size: 0.875rem;
            margin-left: 8px;
        }

        main {
            margin-top: 80px;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(59, 130, 246, 0.12);
            animation: fadeIn 0.6s ease-out;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--itl-dark-text);
        }

        p {
            color: var(--itl-dark-text-subtle);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        label {
            font-weight: 500;
            color: var(--itl-dark-text);
            font-size: 0.875rem;
        }

        .otp-inputs {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.5rem;
        }

        .otp-input {
            width: 100%;
            padding: 1rem;
            background: var(--itl-dark-surface-light);
            border: 2px solid var(--itl-dark-border);
            border-radius: 0.375rem;
            color: var(--itl-dark-text);
            font-size: 1.25rem;
            text-align: center;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            transition: all 0.2s ease;
        }

        .otp-input:focus {
            outline: none;
            border-color: var(--itl-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .regular-input {
            width: 100%;
            padding: 1rem;
            background: var(--itl-dark-surface-light);
            border: 1px solid var(--itl-dark-border);
            border-radius: 0.375rem;
            color: var(--itl-dark-text);
            font-size: 1rem;
            font-family: var(--itl-font-family);
        }

        .regular-input:focus {
            outline: none;
            border-color: var(--itl-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button[type="submit"] {
            padding: 1.5rem;
            background: var(--itl-primary);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            animation: fadeIn 0.6s ease-out 0.3s backwards;
        }

        button:hover {
            background: var(--itl-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
        }

        .form-footer {
            text-align: center;
            font-size: 0.875rem;
            color: var(--itl-dark-text-subtle);
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        .form-footer a {
            color: var(--itl-primary);
            text-decoration: none;
        }

        #backup-method {
            display: none;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--itl-dark-text-subtle);
            font-size: 0.875rem;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
          .content-wrapper {
            padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
            min-height: auto;
          }

          .card {
            max-width: 100%;
            padding: 1rem;
          }

          .form-header h1 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
          }

          .form-header p {
            font-size: 0.75rem;
          }

          input {
            font-size: 16px !important;
            padding: 0.75rem;
          }

          button {
            padding: 1rem;
            font-size: 0.8rem;
          }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
          .content-wrapper {
            padding: calc(70px + 1rem) 1rem 1rem 1rem;
          }

          .card {
            max-width: 100%;
            padding: 1.25rem;
          }

          .form-header h1 {
            font-size: 1.375rem;
          }

          .form-header p {
            font-size: 0.875rem;
          }

          input {
            font-size: 16px !important;
            padding: 0.875rem;
          }

          button {
            padding: 1.125rem;
            font-size: 0.875rem;
          }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
          .content-wrapper {
            padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
          }

          .card {
            max-width: 100%;
            padding: 1.5rem;
          }

          .form-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
          }

          input {
            font-size: 16px !important;
            padding: 1rem;
          }

          button {
            padding: 1.25rem;
            font-size: 0.9375rem;
          }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
          .content-wrapper {
            padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
          }

          .card {
            max-width: 450px;
            padding: 1.75rem;
          }

          .form-header h1 {
            font-size: 1.625rem;
          }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
          .card {
            max-width: 500px;
            padding: 2rem;
          }

          .form-header h1 {
            font-size: 1.75rem;
          }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
          .card {
            max-width: 500px;
            padding: 2.5rem;
          }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌙 ITlusions</h1>
        <div class="lang-switch">
            <button onclick="switchLanguage('en')">English</button>
            <button onclick="switchLanguage('nl')">Nederlands</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="form-header">
                <h1 id="form-title">Two-Factor Authentication</h1>
                <p id="form-subtitle">Enter the 6-digit code from your authenticator app.</p>
            </div>

            <form onsubmit="handleSubmit(event)" id="otp-method">
                <div class="form-group">
                    <label id="label-code">Verification Code</label>
                    <div class="otp-inputs" id="otp-inputs">
                        <input type="number" class="otp-input" min="0" max="9" maxlength="1" required>
                        <input type="number" class="otp-input" min="0" max="9" maxlength="1" required>
                        <input type="number" class="otp-input" min="0" max="9" maxlength="1" required>
                        <input type="number" class="otp-input" min="0" max="9" maxlength="1" required>
                        <input type="number" class="otp-input" min="0" max="9" maxlength="1" required>
                        <input type="number" class="otp-input" min="0" max="9" maxlength="1" required>
                    </div>
                </div>

                <button type="submit" id="btn-verify">Verify</button>

                <div class="form-footer">
                    <p id="no-app">Don't have your phone? <a href="#" id="link-backup" onclick="switchMethod(event)">Use backup code</a></p>
                </div>
            </form>

            <form onsubmit="handleSubmit(event)" id="backup-method">
                <div class="form-group">
                    <label id="label-backup">Backup Code</label>
                    <input type="text" class="regular-input" placeholder="e.g. XXXX-XXXX" required>
                </div>

                <button type="submit" id="btn-verify-backup">Verify</button>

                <div class="form-footer">
                    <p id="back-to-app"><a href="#" id="link-app" onclick="switchMethod(event)">Back to authenticator</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank" style="color: #60a5fa; text-decoration: none;">ITlusions</a></p>
    </footer>

    <script>
        const translations = {
            en: {
                'form-title': 'Two-Factor Authentication',
                'form-subtitle': 'Enter the 6-digit code from your authenticator app.',
                'label-code': 'Verification Code',
                'btn-verify': 'Verify',
                'no-app': 'Don\'t have your phone? ',
                'link-backup': 'Use backup code',
                'label-backup': 'Backup Code',
                'btn-verify-backup': 'Verify',
                'back-to-app': 'Back to authenticator',
                'link-app': 'Back to authenticator'
            },
            nl: {
                'form-title': 'Verificatie in Twee Stappen',
                'form-subtitle': 'Voer de 6-cijferige code van uw authenticator-app in.',
                'label-code': 'Verificatiecode',
                'btn-verify': 'Verifiëren',
                'no-app': 'Hebt u uw telefoon niet? ',
                'link-backup': 'Gebruik back-upcode',
                'label-backup': 'Back-upcode',
                'btn-verify-backup': 'Verifiëren',
                'back-to-app': 'Terug naar authenticator',
                'link-app': 'Terug naar authenticator'
            }
        };

        function switchLanguage(lang) {
            const t = translations[lang];
            for (const [key, value] of Object.entries(t)) {
                const el = document.getElementById(key);
                if (el) el.textContent = value;
            }
        }

        function switchMethod(event) {
            event.preventDefault();
            const otpMethod = document.getElementById('otp-method');
            const backupMethod = document.getElementById('backup-method');
            
            if (otpMethod.style.display === 'none') {
                otpMethod.style.display = 'flex';
                backupMethod.style.display = 'none';
            } else {
                otpMethod.style.display = 'none';
                backupMethod.style.display = 'flex';
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            alert('In production, this would verify your 2FA code.');
        }

        document.querySelectorAll('.otp-input').forEach((input, index) => {
            input.addEventListener('keyup', function(event) {
                if (this.value.length === this.maxLength && index < 5) {
                    document.querySelectorAll('.otp-input')[index + 1].focus();
                }
                if (event.key === 'Backspace' && index > 0 && this.value === '') {
                    document.querySelectorAll('.otp-input')[index - 1].focus();
                }
            });
        });

        switchLanguage('en');
    </script>
</body>
</html>
