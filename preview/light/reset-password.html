<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITlusions - Reset Password Preview</title>
    <style>
        :root {
            --itl-primary: #2563eb;
            --itl-primary-dark: #1d4ed8;
            --itl-accent: #10b981;
            --itl-gray-600: #475569;
            --itl-gray-700: #334155;
            --itl-gray-900: #0f172a;
            
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            
            --itl-spacing-md: 1rem;
            --itl-spacing-lg: 1.5rem;
            --itl-spacing-xl: 2rem;
            --itl-spacing-2xl: 3rem;
            
            --itl-border-radius: 0.375rem;
            --itl-border-radius-lg: 0.5rem;
            
            --itl-shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--itl-font-family);
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #0f0f1e 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(15, 23, 42, 0.3) 100%);
            z-index: -1;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: var(--itl-spacing-md) 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
        }

        header div {
            padding: 0 var(--itl-spacing-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
        }

        header h1::after {
            content: ".";
            color: var(--itl-accent);
        }

        .lang-switch button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: var(--itl-border-radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            margin-left: 8px;
        }

        main {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: calc(80px + var(--itl-spacing-xl)) var(--itl-spacing-md) var(--itl-spacing-xl);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--itl-border-radius-lg);
            box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(37, 99, 235, 0.1);
            padding: var(--itl-spacing-2xl);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        .form-header {
            text-align: center;
            margin-bottom: var(--itl-spacing-xl);
            animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--itl-gray-900);
        }

        .form-header p {
            color: var(--itl-gray-600);
            margin-top: var(--itl-spacing-sm);
            font-size: 0.875rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: var(--itl-spacing-lg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--itl-spacing-sm);
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.3s;
        }

        label {
            font-weight: 500;
            color: var(--itl-gray-700);
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: var(--itl-spacing-md);
            border: 1px solid #cbd5e1;
            border-radius: var(--itl-border-radius);
            font-size: 1rem;
            font-family: var(--itl-font-family);
        }

        input:focus {
            outline: none;
            border-color: var(--itl-primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: var(--itl-spacing-lg);
            background: var(--itl-primary);
            color: white;
            border: none;
            border-radius: var(--itl-border-radius);
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        button:hover {
            background: var(--itl-primary-dark);
            transform: translateY(-1px);
        }

        .form-footer {
            text-align: center;
            font-size: 0.875rem;
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        .form-footer a {
            color: var(--itl-primary);
            text-decoration: none;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
          .content-wrapper {
            padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
            min-height: auto;
          }

          .card {
            max-width: 100%;
            padding: 1rem;
          }

          .form-header h1 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
          }

          .form-header p {
            font-size: 0.75rem;
          }

          input {
            font-size: 16px !important;
            padding: 0.75rem;
          }

          button {
            padding: 1rem;
            font-size: 0.8rem;
          }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
          .content-wrapper {
            padding: calc(70px + 1rem) 1rem 1rem 1rem;
          }

          .card {
            max-width: 100%;
            padding: 1.25rem;
          }

          .form-header h1 {
            font-size: 1.375rem;
          }

          .form-header p {
            font-size: 0.875rem;
          }

          input {
            font-size: 16px !important;
            padding: 0.875rem;
          }

          button {
            padding: 1.125rem;
            font-size: 0.875rem;
          }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
          .content-wrapper {
            padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
          }

          .card {
            max-width: 100%;
            padding: 1.5rem;
          }

          .form-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
          }

          input {
            font-size: 16px !important;
            padding: 1rem;
          }

          button {
            padding: 1.25rem;
            font-size: 0.9375rem;
          }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
          .content-wrapper {
            padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
          }

          .card {
            max-width: 450px;
            padding: 1.75rem;
          }

          .form-header h1 {
            font-size: 1.625rem;
          }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
          .card {
            max-width: 500px;
            padding: 2rem;
          }

          .form-header h1 {
            font-size: 1.75rem;
          }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
          .card {
            max-width: 500px;
            padding: 2.5rem;
          }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>ITlusions</h1>
            <div class="lang-switch">
                <button onclick="switchLanguage('en')">English</button>
                <button onclick="switchLanguage('nl')">Nederlands</button>
            </div>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="form-header">
                <h1 id="form-title">Reset Your Password</h1>
                <p id="form-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <form onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="email" id="label-email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="user@example.com" required>
                </div>

                <button type="submit" id="btn-send">Send Reset Link</button>

                <div class="form-footer">
                    <p id="remember-password">Remember your password? <a href="#" id="link-signin">Sign In</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank" style="color: rgba(255, 255, 255, 0.9); text-decoration: none;">ITlusions</a></p>
    </footer>

    <script>
        const translations = {
            en: {
                'form-title': 'Reset Your Password',
                'form-subtitle': 'Enter your email address and we\'ll send you a link to reset your password.',
                'label-email': 'Email Address',
                'btn-send': 'Send Reset Link',
                'remember-password': 'Remember your password? ',
                'link-signin': 'Sign In'
            },
            nl: {
                'form-title': 'Stel Uw Wachtwoord In',
                'form-subtitle': 'Voer uw e-mailadres in en we sturen u een link om uw wachtwoord in te stellen.',
                'label-email': 'E-mailadres',
                'btn-send': 'Verzend Resetlink',
                'remember-password': 'Herinnert u uw wachtwoord? ',
                'link-signin': 'Inloggen'
            }
        };

        function switchLanguage(lang) {
            const t = translations[lang];
            for (const [key, value] of Object.entries(t)) {
                const el = document.getElementById(key);
                if (el) el.textContent = value;
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            alert('In production, this would send a password reset email.');
        }

        switchLanguage('en');
    </script>
</body>
</html>
