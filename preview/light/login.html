<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITlusions - Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ITlusions Keycloak Theme */
        /* Exact CSS from login.css */

        :root {
          /* ITlusions Color Palette */
          --itl-primary: #2563eb;        /* Blue primary */
          --itl-primary-dark: #1d4ed8;   /* Darker blue */
          --itl-primary-light: #3b82f6;  /* Lighter blue */
          --itl-secondary: #64748b;      /* Slate gray */
          --itl-accent: #10b981;         /* Emerald green */
          --itl-success: #059669;        /* Success green */
          --itl-warning: #d97706;        /* Warning orange */
          --itl-error: #dc2626;          /* Error red */
          --itl-info: #0891b2;           /* Info cyan */
          
          /* Neutral Colors */
          --itl-gray-50: #f8fafc;
          --itl-gray-100: #f1f5f9;
          --itl-gray-200: #e2e8f0;
          --itl-gray-300: #cbd5e1;
          --itl-gray-400: #94a3b8;
          --itl-gray-500: #64748b;
          --itl-gray-600: #475569;
          --itl-gray-700: #334155;
          --itl-gray-800: #1e293b;
          --itl-gray-900: #0f172a;
          
          /* Typography */
          --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
          --itl-font-mono: 'JetBrains Mono', 'Fira Code', 'Monaco', 'Consolas', monospace;
          
          /* Spacing */
          --itl-spacing-xs: 0.25rem;
          --itl-spacing-sm: 0.5rem;
          --itl-spacing-md: 1rem;
          --itl-spacing-lg: 1.5rem;
          --itl-spacing-xl: 2rem;
          --itl-spacing-2xl: 3rem;
          
          /* Borders */
          --itl-border-radius: 0.375rem;
          --itl-border-radius-lg: 0.5rem;
          --itl-border-width: 1px;
          
          /* Shadows */
          --itl-shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
          --itl-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
          --itl-shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
          --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        /* Keyframe animations */
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes slideDown {
          from {
            opacity: 0;
            transform: translateY(-20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes scaleIn {
          from {
            opacity: 0;
            transform: scale(0.95);
          }
          to {
            opacity: 1;
            transform: scale(1);
          }
        }

        @keyframes backgroundShift {
          0%, 100% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
        }

        /* Base Styles */
        .itlusions-theme {
          font-family: var(--itl-font-family);
          min-height: 100vh;
          color: var(--itl-gray-900);
          line-height: 1.6;
          margin: 0;
          padding: 0;
          position: relative;
          overflow: hidden;
        }

        /* Interactive background with mouse-following effect */
        .itlusions-theme::before {
          content: '';
          position: fixed;
          top: -5%;
          left: -5%;
          width: 110%;
          height: 110%;
          background: 
            linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(15, 23, 42, 0.3) 100%),
            url('file:///d:/repos/ITL.Keycloak.Theme/theme/itlusions/login/resources/img/hero-bg.jpg') center center/cover no-repeat;
          transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
          transform: translate(var(--mouse-x, 0%), var(--mouse-y, 0%));
          z-index: -1;
        }

        .itlusions-theme * {
          box-sizing: border-box;
        }

        html, body {
          margin: 0;
          padding: 0;
        }

        /* Header Styling */
        .itlusions-header {
          background: rgba(255, 255, 255, 0.9);
          backdrop-filter: blur(10px);
          border-bottom: var(--itl-border-width) solid rgba(255, 255, 255, 0.2);
          padding: var(--itl-spacing-md) 0;
          box-shadow: var(--itl-shadow-sm);
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          width: 100%;
          z-index: 1000;
        }

        .itlusions-header-wrapper {
          max-width: 100%;
          width: 100%;
          margin: 0;
          padding: 0 var(--itl-spacing-xl);
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .itlusions-header h1 {
          font-size: 1.875rem;
          font-weight: 700;
          color: var(--itl-primary);
          margin: 0;
          letter-spacing: -0.025em;
        }

        .itlusions-header h1::after {
          content: ".";
          color: var(--itl-accent);
        }

        /* Language Selector */
        .language-dropdown {
          position: relative;
          display: inline-block;
        }

        .language-dropdown button {
          padding: var(--itl-spacing-sm) var(--itl-spacing-md);
          background: white;
          border: var(--itl-border-width) solid var(--itl-gray-300);
          border-radius: var(--itl-border-radius);
          cursor: pointer;
          font-size: 0.875rem;
          font-weight: 500;
          color: var(--itl-gray-700);
          transition: all 0.2s ease;
        }

        .language-dropdown button:hover {
          background: var(--itl-gray-50);
          border-color: var(--itl-gray-400);
        }

        .language-dropdown-content {
          display: none;
          position: absolute;
          background: white;
          min-width: 160px;
          box-shadow: var(--itl-shadow-lg);
          border: var(--itl-border-width) solid var(--itl-gray-200);
          border-radius: var(--itl-border-radius);
          z-index: 1001;
          top: 100%;
          right: 0;
          margin-top: var(--itl-spacing-xs);
        }

        .language-dropdown-content a {
          color: var(--itl-gray-700);
          padding: var(--itl-spacing-md);
          text-decoration: none;
          display: block;
          font-size: 0.875rem;
          transition: background-color 0.2s ease-in-out;
        }

        .language-dropdown-content a:hover {
          background: var(--itl-gray-50);
        }

        .language-dropdown:hover .language-dropdown-content {
          display: block;
        }

        /* Main Content Layout */
        .itlusions-content-wrapper {
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          padding: calc(80px + var(--itl-spacing-xl)) var(--itl-spacing-md) var(--itl-spacing-xl) var(--itl-spacing-md);
        }

        /* Login Card */
        .itlusions-card {
          background: rgba(255, 255, 255, 0.95);
          backdrop-filter: blur(10px);
          border-radius: var(--itl-border-radius-lg);
          box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(37, 99, 235, 0.1);
          padding: var(--itl-spacing-2xl);
          width: 100%;
          max-width: 400px;
          border: var(--itl-border-width) solid rgba(255, 255, 255, 0.2);
          animation: fadeIn 0.6s ease-out;
        }

        /* Form Header */
        .itlusions-form-header {
          text-align: center;
          margin-bottom: var(--itl-spacing-xl);
          animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        .itlusions-form-header h1 {
          font-size: 1.5rem;
          font-weight: 600;
          color: var(--itl-gray-900);
          margin: 0 0 var(--itl-spacing-sm) 0;
        }

        .itlusions-form-header p {
          color: var(--itl-gray-600);
          margin: 0;
          font-size: 0.875rem;
        }

        /* Form Styling */
        .itlusions-form {
          display: flex;
          flex-direction: column;
          gap: var(--itl-spacing-lg);
        }

        .itlusions-form-group {
          display: flex;
          flex-direction: column;
          gap: var(--itl-spacing-sm);
          animation: fadeIn 0.6s ease-out backwards;
        }

        .itlusions-form-group:nth-child(1) {
          animation-delay: 0.2s;
        }

        .itlusions-form-group:nth-child(2) {
          animation-delay: 0.3s;
        }

        .itlusions-form-group:nth-child(3) {
          animation-delay: 0.4s;
        }

        .itlusions-label {
          font-weight: 500;
          color: var(--itl-gray-700);
          font-size: 0.875rem;
          letter-spacing: 0.025em;
        }

        /* Input Styling */
        .itlusions-input {
          padding: var(--itl-spacing-md);
          border: var(--itl-border-width) solid var(--itl-gray-300);
          border-radius: var(--itl-border-radius);
          font-size: 1rem;
          transition: all 0.2s ease-in-out;
          background: white;
          color: var(--itl-gray-900);
          font-family: var(--itl-font-family);
        }

        .itlusions-input:focus {
          outline: none;
          border-color: var(--itl-primary);
          box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .itlusions-input::placeholder {
          color: var(--itl-gray-400);
        }

        /* Checkbox Styling */
        .itlusions-checkbox {
          display: flex;
          align-items: center;
          gap: var(--itl-spacing-sm);
        }

        .itlusions-checkbox input[type="checkbox"] {
          width: auto;
          accent-color: var(--itl-primary);
          cursor: pointer;
        }

        .itlusions-checkbox label {
          margin: 0;
          font-size: 0.875rem;
          cursor: pointer;
          font-weight: 400;
        }

        /* Button Styling */
        .itlusions-button {
          padding: var(--itl-spacing-md) var(--itl-spacing-lg);
          border-radius: var(--itl-border-radius);
          font-weight: 500;
          font-size: 0.875rem;
          text-decoration: none;
          cursor: pointer;
          transition: all 0.2s ease-in-out;
          border: var(--itl-border-width) solid transparent;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: var(--itl-spacing-sm);
          min-height: 2.5rem;
          letter-spacing: 0.025em;
          font-family: var(--itl-font-family);
        }

        .itlusions-button--primary {
          background: var(--itl-primary);
          color: white;
          border-color: var(--itl-primary);
          width: 100%;
        }

        .itlusions-button--primary:hover {
          background: var(--itl-primary-dark);
          border-color: var(--itl-primary-dark);
          transform: translateY(-1px);
          box-shadow: var(--itl-shadow-md);
        }

        .itlusions-button--secondary {
          background: white;
          color: var(--itl-gray-700);
          border-color: var(--itl-gray-300);
        }

        .itlusions-button--secondary:hover {
          background: var(--itl-gray-50);
          border-color: var(--itl-gray-400);
        }

        .itlusions-button--large {
          padding: var(--itl-spacing-lg) var(--itl-spacing-xl);
          font-size: 1rem;
          min-height: 3rem;
        }

        .itlusions-button--social {
          background: white;
          border-color: var(--itl-gray-300);
          color: var(--itl-gray-700);
          justify-content: center;
          position: relative;
          width: 100%;
        }

        .itlusions-button--social:hover {
          background: var(--itl-gray-50);
          border-color: var(--itl-gray-400);
        }

        /* Social Providers */
        .itlusions-social-providers {
          margin-top: var(--itl-spacing-lg);
          padding-top: var(--itl-spacing-lg);
          border-top: var(--itl-border-width) solid var(--itl-gray-200);
          animation: fadeIn 0.6s ease-out 0.6s backwards;
        }
          display: flex;
          flex-direction: column;
          gap: var(--itl-spacing-md);
        }

        /* Form Options */
        .itlusions-form-options {
          display: flex;
          justify-content: center;
          gap: var(--itl-spacing-sm);
          font-size: 0.875rem;
          margin-top: var(--itl-spacing-md);
          animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        .itlusions-form-options a {
          color: var(--itl-primary);
          text-decoration: none;
          font-weight: 500;
          transition: color 0.2s ease-in-out;
        }

        .itlusions-form-options a:hover {
          color: var(--itl-primary-dark);
          text-decoration: underline;
        }

        /* Alert Styling */
        .itlusions-alert {
          padding: var(--itl-spacing-md);
          border-radius: var(--itl-border-radius);
          border: var(--itl-border-width) solid;
          margin-bottom: var(--itl-spacing-md);
          font-size: 0.875rem;
          line-height: 1.5;
        }

        .itlusions-alert--error {
          background: rgb(239 68 68 / 0.1);
          border-color: var(--itl-error);
          color: var(--itl-error);
        }

        /* Footer */
        .itlusions-footer {
          text-align: center;
          padding: var(--itl-spacing-xl);
          color: var(--itl-gray-500);
          font-size: 0.875rem;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: rgba(255, 255, 255, 0.5);
        }

        .itlusions-footer a {
          color: var(--itl-primary);
          text-decoration: none;
        }

        .itlusions-footer a:hover {
          text-decoration: underline;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
          .itlusions-header {
            padding: 0.75rem 0;
          }

          .itlusions-header h1 {
            font-size: 1.25rem;
          }

          .language-dropdown button {
            padding: var(--itl-spacing-xs) 0.375rem;
            font-size: 0.65rem;
          }

          .itlusions-content-wrapper {
            padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
            min-height: auto;
          }

          .itlusions-card {
            max-width: 100%;
            width: 100%;
            padding: 1rem;
            margin: 0;
          }

          .itlusions-form-header h1 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
          }

          .itlusions-form-header p {
            font-size: 0.75rem;
          }

          .itlusions-form-group {
            margin-bottom: 1rem;
          }

          label {
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
          }

          input, select, textarea {
            font-size: 16px !important;
            padding: 0.75rem;
          }

          button[type="submit"], .itlusions-button {
            padding: 1rem;
            font-size: 0.8rem;
            border-radius: 0.25rem;
          }

          .itlusions-form-options,
          .itlusions-divider,
          .itlusions-social-providers {
            margin-top: 1rem;
          }

          .itlusions-form-footer {
            font-size: 0.75rem;
          }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
          .itlusions-header h1 {
            font-size: 1.5rem;
          }

          .itlusions-content-wrapper {
            padding: calc(70px + 1rem) 1rem 1rem 1rem;
          }

          .itlusions-card {
            max-width: 100%;
            padding: 1.25rem;
          }

          .itlusions-form-header h1 {
            font-size: 1.375rem;
          }

          .itlusions-form-header p {
            font-size: 0.875rem;
          }

          input, select, textarea {
            font-size: 16px !important;
            padding: 0.875rem;
          }

          button[type="submit"], .itlusions-button {
            padding: 1.125rem;
            font-size: 0.875rem;
          }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
          .itlusions-header h1 {
            font-size: 1.625rem;
          }

          .itlusions-content-wrapper {
            padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
          }

          .itlusions-card {
            max-width: 100%;
            padding: 1.5rem;
          }

          .itlusions-form-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
          }

          input, select, textarea {
            font-size: 16px !important;
            padding: 1rem;
          }

          button[type="submit"], .itlusions-button {
            padding: 1.25rem;
            font-size: 0.9375rem;
          }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
          .itlusions-header h1 {
            font-size: 1.875rem;
          }

          .itlusions-content-wrapper {
            padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
          }

          .itlusions-card {
            max-width: 450px;
            padding: 1.75rem;
          }

          .itlusions-form-header h1 {
            font-size: 1.625rem;
          }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
          .itlusions-card {
            max-width: 500px;
            padding: 2rem;
          }

          .itlusions-form-header h1 {
            font-size: 1.75rem;
          }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
          .itlusions-card {
            max-width: 500px;
            padding: 2.5rem;
          }
        }

        /* Generic Mobile Fallback (max-width: 640px) */
        @media (max-width: 640px) {
          .itlusions-header-wrapper {
            padding: 0 var(--itl-spacing-sm);
          }

          .language-dropdown button {
            padding: var(--itl-spacing-xs) var(--itl-spacing-sm);
            font-size: 0.75rem;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .itlusions-theme::before {
            transform: none !important;
            transition: none !important;
          }
          
          .itlusions-card {
            animation: none !important;
          }
        }
    </style>
</head>

<body class="itlusions-theme itlusions-responsive">
    <!-- Header -->
    <header class="itlusions-header">
        <div class="itlusions-header-wrapper">
            <h1>ITlusions</h1>
            <div class="language-dropdown">
                <button type="button" id="lang-btn">en</button>
                <div class="language-dropdown-content">
                    <a href="#" onclick="setLanguage('en'); return false;">English</a>
                    <a href="#" onclick="setLanguage('nl'); return false;">Nederlands</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="itlusions-content-wrapper">
        <div class="itlusions-card">
            <!-- Form Header -->
            <div class="itlusions-form-header">
                <h1 id="form-title">Welcome to ITlusions</h1>
                <p id="form-subtitle">Empowering Your DevOps Transformation</p>
            </div>

            <!-- Form -->
            <form id="kc-form-login" class="itlusions-form" onsubmit="handleSubmit(event)">
                <div class="itlusions-form-group">
                    <label for="username" class="itlusions-label" id="label-username">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="itlusions-input" 
                        name="username" 
                        placeholder="Enter username or email"
                        autofocus
                        autocomplete="username"
                    />
                </div>

                <div class="itlusions-form-group">
                    <label for="password" class="itlusions-label" id="label-password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="itlusions-input" 
                        name="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    />
                </div>

                <div class="itlusions-form-group">
                    <div class="itlusions-checkbox">
                        <input type="checkbox" id="rememberMe" name="rememberMe" />
                        <label for="rememberMe" id="label-remember">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="itlusions-button itlusions-button--primary" id="btn-signin" style="animation: scaleIn 0.6s ease-out 0.45s backwards;">Sign In</button>

                <div class="itlusions-form-options">
                    <a href="#" id="forgot-password">Forgot Password?</a>
                    <a href="#" id="create-account">Create Account</a>
                </div>
            </form>

            <!-- Social Providers -->
            <div class="itlusions-social-providers">
                <a href="#" class="itlusions-button itlusions-button--social" id="social-github">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span id="social-github-text">Github</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="itlusions-footer">
        <p>
            &copy; 2026 
            <a href="https://itlusions.nl" target="_blank">ITlusions</a>. 
            Your trusted partner in digital transformation.
        </p>
    </footer>

    <script>
        // Language translations
        const translations = {
            en: {
                'form-title': 'Welcome to ITlusions',
                'form-subtitle': 'Empowering Your DevOps Transformation',
                'label-username': 'Username or Email',
                'label-password': 'Password',
                'label-remember': 'Remember me',
                'btn-signin': 'Sign In',

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-btn').textContent = lang;
            
            Object.keys(translations[lang]).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function handleSubmit(event) {
            event.preventDefault();
            alert('Form submitted (preview mode)');
        }

        // Interactive background effect - mouse tracking
        function initInteractiveBackground() {
            const themeElement = document.querySelector('.itlusions-theme');
            
            if (!themeElement) {
                console.log('ITlusions theme element not found');
                return;
            }
            
            const mouseSensitivity = 20;
            
            function handleMouseMove(e) {
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                const mouseX = (e.clientX / windowWidth) * 100;
                const mouseY = (e.clientY / windowHeight) * 100;
                
                const moveX = (mouseX - 50) / mouseSensitivity;
                const moveY = (mouseY - 50) / mouseSensitivity;
                
                themeElement.style.setProperty('--mouse-x', `${moveX}%`);
                themeElement.style.setProperty('--mouse-y', `${moveY}%`);
            }
            
            document.addEventListener('mousemove', handleMouseMove);
            
            document.addEventListener('mouseleave', function() {
                themeElement.style.setProperty('--mouse-x', '0%');
                themeElement.style.setProperty('--mouse-y', '0%');
            });
            
            themeElement.style.setProperty('--mouse-x', '0%');
            themeElement.style.setProperty('--mouse-y', '0%');
            
            console.log('ITlusions interactive background initialized');
        }

        // Initialize on DOM ready
        if (document.readyState !== 'loading') {
            initInteractiveBackground();
        } else {
            document.addEventListener('DOMContentLoaded', initInteractiveBackground);
        }
    </script>
