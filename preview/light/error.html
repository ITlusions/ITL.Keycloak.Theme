<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITlusions - Error Preview</title>
    <style>
        :root {
            --itl-primary: #2563eb;
            --itl-accent: #10b981;
            --itl-error: #dc2626;
            --itl-gray-600: #475569;
            --itl-gray-700: #334155;
            --itl-gray-900: #0f172a;
            
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            
            --itl-spacing-lg: 1.5rem;
            --itl-spacing-xl: 2rem;
            --itl-spacing-2xl: 3rem;
            
            --itl-border-radius-lg: 0.5rem;
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--itl-font-family);
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #0f0f1e 100%);
        }

        body::before {
            content: '';
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(15, 23, 42, 0.3) 100%);
            z-index: -1;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
        }

        header div {
            padding: 0 var(--itl-spacing-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
        }

        header h1::after {
            content: ".";
            color: var(--itl-accent);
        }

        .lang-switch button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            margin-left: 8px;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: calc(80px + 2rem) 1rem 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--itl-border-radius-lg);
            box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(37, 99, 235, 0.1);
            padding: var(--itl-spacing-2xl);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        .error-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--itl-spacing-lg);
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideDown 0.6s ease-out 0.1s backwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            color: var(--itl-error);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--itl-gray-900);
            margin: 0;
            animation: slideDown 0.6s ease-out 0.2s backwards;
        }

        p {
            color: var(--itl-gray-700);
            line-height: 1.6;
            margin: 0;
            animation: fadeIn 0.6s ease-out 0.3s backwards;
        }

        .error-message {
            color: var(--itl-error);
            font-weight: 500;
        }

        .button {
            display: inline-block;
            padding: 0.875rem 1.5rem;
            background: var(--itl-primary);
            color: white;
            text-decoration: none;
            border-radius: 0.375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .button-secondary {
            background: white;
            color: var(--itl-gray-700);
            border: 1px solid #cbd5e1;
            margin-left: 0.5rem;
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        .button-secondary:hover {
            background: #f1f5f9;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
          .content-wrapper {
            padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
            min-height: auto;
          }

          .card {
            max-width: 100%;
            padding: 1rem;
          }

          h1 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
          }

          p {
            font-size: 0.875rem;
          }

          .button {
            padding: 1rem;
            font-size: 0.8rem;
          }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
          .content-wrapper {
            padding: calc(70px + 1rem) 1rem 1rem 1rem;
          }

          .card {
            max-width: 100%;
            padding: 1.25rem;
          }

          h1 {
            font-size: 1.375rem;
          }

          p {
            font-size: 0.875rem;
          }

          .button {
            padding: 1.125rem;
            font-size: 0.875rem;
          }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
          .content-wrapper {
            padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
          }

          .card {
            max-width: 100%;
            padding: 1.5rem;
          }

          h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
          }

          .button {
            padding: 1.25rem;
            font-size: 0.9375rem;
          }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
          .content-wrapper {
            padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
          }

          .card {
            max-width: 450px;
            padding: 1.75rem;
          }

          h1 {
            font-size: 1.625rem;
          }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
          .card {
            max-width: 500px;
            padding: 2rem;
          }

          h1 {
            font-size: 1.75rem;
          }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
          .card {
            max-width: 500px;
            padding: 2.5rem;
          }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>ITlusions</h1>
            <div class="lang-switch">
                <button onclick="switchLanguage('en')">English</button>
                <button onclick="switchLanguage('nl')">Nederlands</button>
            </div>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="error-content">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>

                <h1 id="error-title">We're sorry...</h1>

                <p id="error-message">An error occurred during authentication.</p>

                <p class="error-message" id="error-code">Error: Authentication failed</p>

                <p id="error-description">Please try again or contact support if the problem persists.</p>

                <div>
                    <button class="button" onclick="goBack()" id="btn-retry">Try Again</button>
                    <button class="button button-secondary" onclick="goHome()" id="btn-home">Go Home</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank" style="color: rgba(255, 255, 255, 0.9); text-decoration: none;">ITlusions</a></p>
    </footer>

    <script>
        const translations = {
            en: {
                'error-title': 'We\'re sorry...',
                'error-message': 'An error occurred during authentication.',
                'error-code': 'Error: Authentication failed',
                'error-description': 'Please try again or contact support if the problem persists.',
                'btn-retry': 'Try Again',
                'btn-home': 'Go Home'
            },
            nl: {
                'error-title': 'Het spijt ons...',
                'error-message': 'Er is een fout opgetreden tijdens authenticatie.',
                'error-code': 'Fout: Authenticatie mislukt',
                'error-description': 'Probeer het opnieuw of neem contact op met ondersteuning als het probleem aanhoudt.',
                'btn-retry': 'Opnieuw proberen',
                'btn-home': 'Naar startpagina'
            }
        };

        function switchLanguage(lang) {
            const t = translations[lang];
            for (const [key, value] of Object.entries(t)) {
                const el = document.getElementById(key);
                if (el) el.textContent = value;
            }
        }

        function goBack() {
            alert('In production, this would retry the authentication flow.');
        }

        function goHome() {
            alert('In production, this would redirect to the home page.');
        }

        switchLanguage('en');
    </script>
</body>
</html>
