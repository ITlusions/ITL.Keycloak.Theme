<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITlusions - Authentication Success Preview</title>
    <style>
        :root {
            /* ITlusions Color Palette */
            --itl-primary: #2563eb;        /* Blue primary */
            --itl-primary-dark: #1d4ed8;   /* Darker blue */
            --itl-primary-light: #3b82f6;  /* Lighter blue */
            --itl-secondary: #64748b;      /* Slate gray */
            --itl-accent: #10b981;         /* Emerald green */
            --itl-success: #059669;        /* Success green */
            --itl-warning: #d97706;        /* Warning orange */
            --itl-error: #dc2626;          /* Error red */
            --itl-info: #0891b2;           /* Info cyan */
            
            /* Neutral Colors */
            --itl-gray-50: #f8fafc;
            --itl-gray-100: #f1f5f9;
            --itl-gray-200: #e2e8f0;
            --itl-gray-300: #cbd5e1;
            --itl-gray-400: #94a3b8;
            --itl-gray-500: #64748b;
            --itl-gray-600: #475569;
            --itl-gray-700: #334155;
            --itl-gray-800: #1e293b;
            --itl-gray-900: #0f172a;
            
            /* Typography */
            --itl-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            
            /* Spacing */
            --itl-spacing-xs: 0.25rem;
            --itl-spacing-sm: 0.5rem;
            --itl-spacing-md: 1rem;
            --itl-spacing-lg: 1.5rem;
            --itl-spacing-xl: 2rem;
            --itl-spacing-2xl: 3rem;
            
            /* Borders */
            --itl-border-radius: 0.375rem;
            --itl-border-radius-lg: 0.5rem;
            --itl-border-width: 1px;
            
            /* Shadows */
            --itl-shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --itl-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --itl-shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --itl-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: var(--itl-font-family);
            min-height: 100vh;
            color: var(--itl-gray-900);
            line-height: 1.6;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(15, 23, 42, 0.3) 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #0f0f1e 100%);
            z-index: -1;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: var(--itl-border-width) solid rgba(255, 255, 255, 0.2);
            padding: var(--itl-spacing-md) 0;
            box-shadow: var(--itl-shadow-sm);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
        }

        header div {
            max-width: 100%;
            width: 100%;
            padding: 0 var(--itl-spacing-xl);
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--itl-primary);
            margin: 0;
            letter-spacing: -0.025em;
        }

        header h1::after {
            content: ".";
            color: var(--itl-accent);
        }

        /* Main Content */
        main {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: calc(80px + var(--itl-spacing-xl)) var(--itl-spacing-md) var(--itl-spacing-xl) var(--itl-spacing-md);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--itl-border-radius-lg);
            box-shadow: var(--itl-shadow-lg), 0 0 40px rgba(37, 99, 235, 0.1);
            padding: var(--itl-spacing-2xl);
            width: 100%;
            max-width: 400px;
            border: var(--itl-border-width) solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        .form-header {
            text-align: center;
            margin-bottom: var(--itl-spacing-xl);
            display: none;
        }

        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--itl-gray-900);
            margin: 0 0 var(--itl-spacing-sm) 0;
        }

        .form-header p {
            color: var(--itl-gray-600);
            margin: 0;
            font-size: 0.875rem;
        }

        /* Keyframes */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes checkmark {
            0% {
                stroke-dasharray: 50;
                stroke-dashoffset: 50;
            }
            100% {
                stroke-dasharray: 50;
                stroke-dashoffset: 0;
            }
        }

        /* Authenticated Content */
        #kc-authenticated {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .authenticated-content {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--itl-spacing-2xl);
        }

        .authenticated-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--itl-accent) 0%, var(--itl-success) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            animation: scaleIn 0.5s ease-out;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
        }

        .success-icon {
            width: 48px;
            height: 48px;
            color: white;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: checkmark 0.6s ease-out 0.2s both;
        }

        .authenticated-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--itl-gray-900);
            margin: 0;
            letter-spacing: -0.025em;
            animation: slideDown 0.6s ease-out;
        }

        .authenticated-message {
            font-size: 1.125rem;
            color: var(--itl-gray-700);
            margin: 0;
            font-weight: 500;
            animation: slideDown 0.6s ease-out 0.1s both;
        }

        .authenticated-subtitle {
            font-size: 0.95rem;
            color: var(--itl-gray-600);
            margin: 0;
            animation: slideDown 0.6s ease-out 0.2s both;
            line-height: 1.6;
        }

        #countdown {
            font-weight: 700;
            color: var(--itl-primary);
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--itl-spacing-md);
            padding: var(--itl-spacing-lg) var(--itl-spacing-xl);
            background: var(--itl-primary);
            color: white;
            border: none;
            border-radius: var(--itl-border-radius);
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            min-height: 3rem;
            letter-spacing: 0.025em;
            animation: slideDown 0.6s ease-out 0.3s both;
        }

        .button:hover {
            background: var(--itl-primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--itl-shadow-lg);
        }

        .button:active {
            transform: translateY(0);
        }

        /* Language Switch */
        .lang-switch {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 999;
        }

        .lang-switch button {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--itl-gray-300);
            border-radius: var(--itl-border-radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--itl-gray-700);
            transition: all 0.2s ease;
        }

        .lang-switch button:hover {
            background: var(--itl-gray-50);
            border-color: var(--itl-gray-400);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            z-index: 500;
        }

        /* Responsive Design - Mobile First */
        
        /* Extra Small Devices (320px - 374px) */
        @media (max-width: 374px) {
            main {
                padding: calc(60px + 0.5rem) 0.5rem 0.5rem 0.5rem;
                min-height: auto;
            }

            .card {
                max-width: 100%;
                padding: 1rem;
            }

            .authenticated-icon {
                width: 56px;
                height: 56px;
            }

            .success-icon {
                width: 28px;
                height: 28px;
            }

            .authenticated-title {
                font-size: 1.25rem;
                margin-bottom: 0.5rem;
            }

            .authenticated-message {
                font-size: 0.875rem;
            }

            .button {
                width: 100%;
                padding: 0.875rem;
                font-size: 0.8rem;
            }
        }

        /* Small Devices (375px - 425px) */
        @media (min-width: 375px) and (max-width: 425px) {
            main {
                padding: calc(70px + 1rem) 1rem 1rem 1rem;
            }

            .card {
                max-width: 100%;
                padding: 1.25rem;
            }

            .authenticated-icon {
                width: 60px;
                height: 60px;
            }

            .success-icon {
                width: 32px;
                height: 32px;
            }

            .authenticated-title {
                font-size: 1.375rem;
            }

            .button {
                width: 100%;
                padding: 1rem;
                font-size: 0.875rem;
            }
        }

        /* Medium Mobile (426px - 640px) */
        @media (min-width: 426px) and (max-width: 640px) {
            main {
                padding: calc(75px + 1.25rem) 1.25rem 1.25rem 1.25rem;
            }

            .card {
                max-width: 100%;
                padding: 1.5rem;
            }

            .authenticated-icon {
                width: 64px;
                height: 64px;
            }

            .success-icon {
                width: 36px;
                height: 36px;
            }

            .authenticated-title {
                font-size: 1.5rem;
            }

            .authenticated-message {
                font-size: 1rem;
            }

            .button {
                width: 100%;
                padding: 1.125rem;
                font-size: 0.9375rem;
            }
        }

        /* Tablets & Small Screens (641px - 768px) */
        @media (min-width: 641px) and (max-width: 768px) {
            main {
                padding: calc(80px + 1.5rem) 1.5rem 1.5rem 1.5rem;
            }

            .card {
                max-width: 450px;
                padding: 1.75rem;
            }

            .authenticated-icon {
                width: 72px;
                height: 72px;
            }

            .success-icon {
                width: 40px;
                height: 40px;
            }

            .authenticated-title {
                font-size: 1.625rem;
            }
        }

        /* Medium Tablets (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .card {
                max-width: 500px;
                padding: 2rem;
            }

            .authenticated-icon {
                width: 80px;
                height: 80px;
            }

            .authenticated-title {
                font-size: 1.75rem;
            }
        }

        /* Large Screens (1025px+) */
        @media (min-width: 1025px) {
            .card {
                max-width: 500px;
                padding: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div>
            <h1>ITlusions</h1>
        </div>
    </header>

    <!-- Language Switch -->
    <div class="lang-switch">
        <button onclick="switchLanguage('en')">English</button>
        <button onclick="switchLanguage('nl')">Nederlands</button>
    </div>

    <!-- Main Content -->
    <main>
        <div class="card">
            <div id="kc-authenticated">
                <div class="authenticated-content">
                    <div class="authenticated-icon">
                        <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    
                    <h1 class="authenticated-title" id="title">Successfully Authenticated</h1>
                    
                    <p class="authenticated-message" id="message">You have successfully logged in to the system.</p>
                    
                    <p class="authenticated-subtitle" id="subtitle">
                        This window will close automatically in <span id="countdown">5</span> seconds.
                    </p>
                    
                    <button class="button" onclick="goBack()" id="button-text">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                        <span>Back to Application</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <a href="https://itlusions.nl" target="_blank" style="color: rgba(255, 255, 255, 0.9); text-decoration: none;">ITlusions</a>. Your trusted partner in digital transformation.</p>
    </footer>

    <script>
        const CLOSE_DELAY = 5000;
        const REDIRECT_DELAY = 3000;
        
        const translations = {
            en: {
                title: 'Successfully Authenticated',
                message: 'You have successfully logged in to the system.',
                subtitle_prefix: 'This window will close automatically in ',
                subtitle_suffix: ' seconds.',
                button: 'Back to Application'
            },
            nl: {
                title: 'Succesvol Geverifieerd',
                message: 'U bent succesvol aangemeld bij het systeem.',
                subtitle_prefix: 'Dit venster wordt automatisch gesloten over ',
                subtitle_suffix: ' seconden.',
                button: 'Terug naar Applicatie'
            }
        };

        let currentLang = 'en';
        let countdownInterval;
        let remaining = 5;

        function switchLanguage(lang) {
            currentLang = lang;
            updateLanguage();
        }

        function updateLanguage() {
            const t = translations[currentLang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('message').textContent = t.message;
            document.getElementById('button-text').innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
                <span>${t.button}</span>
            `;
            updateSubtitle();
        }

        function updateSubtitle() {
            const t = translations[currentLang];
            const subtitle = document.getElementById('subtitle');
            subtitle.innerHTML = `${t.subtitle_prefix}<span id="countdown">${remaining}</span>${t.subtitle_suffix}`;
        }

        function startCountdown() {
            remaining = 5;
            updateSubtitle();
            
            countdownInterval = setInterval(function() {
                remaining--;
                document.getElementById('countdown').textContent = remaining;
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    // Auto-close (or redirect in real scenario)
                    alert('In production, this would close the window or redirect to the application.');
                }
            }, 1000);
        }

        function goBack() {
            clearInterval(countdownInterval);
            alert('In production, you would be redirected to the application.');
        }

        // Initialize
        updateLanguage();
        startCountdown();
    </script>
</body>
</html>
